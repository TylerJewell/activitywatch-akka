akka.javasdk.dev-mode.http-port = 9150

# How quickly a write reaches a subscriber -- RENDERING.md R1.2 asks for a 95th
# percentile inside 250 ms and the runtime's defaults give about 3 seconds, nearly all
# of it the look-behind.
#
# The look-behind exists because the timestamp a view row is stamped with is written by
# the database, and two writers' clocks can disagree; a query that looked no further back
# than "now" would miss a row stamped slightly in the past. Three seconds of tolerance is
# right for a service whose writers are spread across regions. Every writer here is this
# one process, so the skew it protects against is a process disagreeing with itself, and
# 300 ms is a wide margin for that. An operator running this across regions should put the
# default back and expect R1.2 to read about three seconds.
akka.runtime.view {
  streaming-updates-poll-interval = 100ms
  streaming-updates-look-behind = 300ms
}

activitywatch {
  # The server's own identity, answered by GET /api/0/info.
  hostname = ""
  hostname = ${?AW_HOSTNAME}

  # Whether the server behaves as `aw-server --testing`: bucket deletion needs no ?force=1
  # and an extra CORS origin is allowed.
  testing = false
  testing = ${?AW_TESTING}

  # 0 keeps every event a bucket has ever held. A positive number caps it and the bucket
  # then reports itself incomplete, so a caller can tell a short answer from a short
  # history -- SPEC-001 section 4 OD-4.
  retained-events = 0
  retained-events = ${?AW_RETAINED_EVENTS}

  # Origins allowed through CORS beyond the built-in extension wildcard, comma separated.
  cors-origins = ""
  cors-origins = ${?AW_CORS_ORIGINS}

  # Which host the host-header check accepts besides localhost and 127.0.0.1.
  host = "localhost"
  host = ${?AW_HOST}

  watchers {
    # The watchers poll the operating system, so they are off unless asked for.
    afk {
      enabled = false
      enabled = ${?AW_WATCHER_AFK}
      timeout = 180
      poll-time = 5
    }
    window {
      enabled = false
      enabled = ${?AW_WATCHER_WINDOW}
      poll-time = 1.0
      exclude-title = false
    }
    input {
      enabled = false
      enabled = ${?AW_WATCHER_INPUT}
      poll-time = 5
    }
  }
}
